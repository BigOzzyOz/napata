<section class="contact-form-container">
    <div class="contact-form-header">
        <h2>Los geht's...</h2>
        <div class="contact-form-header__divider"></div>
        <p>Nimm gerne Kontakt mit uns auf und lasse uns wissen wer du bist:</p>
    </div>
    <form class="contact-form">
        <div class="form-group">
            <label for="sure-name">Dein Name</label>
            <input type="text" id="sure-name" name="sure-name" required>
        </div>
        <div class="form-group">
            <label for="first-name">Dein Vorname</label>
            <input type="text" id="first-name" name="first-name" required>
        </div>
        <div class="form-group">
            <label for="email">Deine E-Mail-Adresse</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="subject">Betreff</label>
            <input type="text" id="subject" name="subject" required>
        </div>
        <div class="form-group">
            <label for="message">Deine Nachricht</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">Senden</button>
    </form>
</section>
